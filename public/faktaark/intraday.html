<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Faktaark: Intraday Aktiv (placeholder)</title>
<style>
/* Naia-tokens (samme værdier som i index.html) */
:root{color-scheme:light;--font-family:"PP Radio Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;--surface:#FFFFFF;--bg:#F5F2ED;--text:#000000;--muted:#808080;--border:#D9D6D2;--warn-bg:#FEF5D0;--warn-border:#E0B712;--sp:16px}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--surface:#452727;--bg:#300F0F;--text:#FFFFFF;--muted:#C1B7B7;--border:#6E5757;--warn-bg:#4A3420}}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-family);font-size:14px;line-height:20px}
main{max-width:640px;margin:0 auto;padding:48px var(--sp)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:24px}
.warn{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:6px;padding:12px var(--sp);margin-bottom:24px}
h1{font-size:32px;line-height:38px;letter-spacing:-.6px;margin:0 0 8px}
p{margin:0 0 12px} .muted{color:var(--muted)} a{color:var(--text)}
</style>
</head>
<body>
<main>
  <div class="warn"><strong>Simulerede resultater. Ikke faktiske afkast.</strong> Demo. Ingen rigtige penge.</div>
  <div class="card">
    <h1>Faktaark: Intraday Aktiv</h1>
    <p class="muted">Risikoklasse 6 af 7</p>
    <p>Her kommer produktets faktaark (central investorinformation) som PDF. Siden er en placeholder i prototypen.</p>
    <p><a href="../#produkt/intraday">← Tilbage til produktet</a></p>
  </div>
</main>
</body>
</html>
